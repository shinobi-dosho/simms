[project]
name = "simms"
version = "3.0.2"
description = "Simms 3.0. Tool for end-to-end simulations of radio inteferometer observations"
authors = [
    {name="Sphesihle Makhathini", email="sphemakh@gmail.com"},
    {name="Mika Naidoo", email="mika.naidoo25@gmail.com"},
    {name="Mukundi Ramanyimi", email="ramayimimukundi6@gmail.com"},
    {name="Shibre Semane", email= "sshibre0@gmail.com"},
    {name="Galefang Mapunda", email="allymap@gmail.com"},
    {name="Senkhosi Simelane", email="senkhxsi@gmail.com"},
    ]

readme = "README.rst"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "tqdm",
    # 8.3.3 fixes the `click.edit()` advisory; simms never calls it, but the floor is
    # what a downstream resolver sees, and fitstoolz already requires it.
    "click>=8.3.3,<9.0",
    "dask-ms[xarray]>=0.2.18,<1.0",
    "ephem>=4.1,<5.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "stimela-ninja>=0.1.0b4",
    "codex-africanus[complete]>=0.3.7,<1.0",
    "ducc0>=0.41.0",
    "fitstoolz>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/simms",
    "/README.rst",
    "/LICENSE",
    "/CHANGES.md",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simms"]

[project.scripts]
simms = "simms.apps.main:cli"

[tool.uv]
# Pre-releases are allowed only where a requirement explicitly asks for one
# (fitstoolz>=0.1.0b4, stimela-ninja) or where a package publishes nothing else -- uv's
# own default, stated here so it is not widened back to "allow". A blanket "allow" put
# pydantic on a 2.14 alpha and omegaconf on a dev build, at runtime.
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
# The shinobi port of fitstoolz, which drops scabha for stimela-ninja/pydantic -- the same
# move simms itself made. Not on PyPI yet, so pinned to a commit here.
#
# Sourced as a GitHub archive rather than `git = ...` on purpose: uv shells out to the git
# binary for a git source, and the casa6 image used by the CASA CI job has no git and a
# broken apt (its KERN PPA has no ca-certificates). A tarball is fetched over plain HTTP,
# and pins the same commit just as immutably.
stimela-ninja = { url = "https://github.com/shinobi-dosho/stimela-ninja/archive/d5294749a7f2b74c506681da9de026b8ca76942c.tar.gz" }

[project.urls]
Documentation = "https://simms.readthedocs.io"
Repository = "https://github.com/shinobi-dosho/simms.git"
"Issue Tracker" = "https://github.com/shinobi-dosho/simms/issues"
Changelog = "https://github.com/shinobi-dosho/simms/blob/main/CHANGES.md"

[dependency-groups]

# The one place ruff's version is decided. The lint CI job and the .githooks/pre-commit
# hook both run it through `uv run --group ruff`, so they cannot disagree about which
# rules exist (UP038 was removed between 0.12 and 0.15, so a pinned-elsewhere hook could
# pass while CI failed).
ruff = [
    "ruff>=0.15.22,<0.16",
]

tests = [
    "pytest>=9.0.3",
    {include-group = "ruff"},
]

# Opt-in: the CASA round-trip test (tests/casa_roundtrip_tests.py) images MSs with
# casatasks.tclean. Heavy (pulls casatools) so it is kept out of the default `tests`
# group; the test itself skips when casatasks is absent. Run with:
#   uv run --group tests --group casa python -m pytest tests/casa_roundtrip_tests.py
casa = [
    "casatasks>=6.6",
]

docs = [
    "Sphinx>=7.0,<9.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-copybutton",
    "sphinx_click",
    "sphinx-autodoc-typehints",
    "docutils",
    "sphinxcontrib-autoyaml",
]

dev = [
    "jupyter",
    "matplotlib",
    {include-group = "tests"},
]

[tool.pytest.ini_options]
python_files = ["*_tests.py"]
testpaths = ["tests"]
pythonpath = ["src"]
